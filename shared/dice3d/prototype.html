<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dados — movimiento del teléfono</title>
<style>body{overflow:hidden;margin:0;background:#101526;color:white;font:18px monospace}canvas{position:absolute;inset:0}#status{position:absolute;bottom:210px;left:0;right:0;text-align:center;z-index:2;color:#a8bddb;font:14px system-ui;pointer-events:none}#controls{position:fixed;z-index:3;bottom:max(18px,env(safe-area-inset-bottom));left:12px;right:12px;text-align:center;font:14px system-ui;color:#a8bddb}.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}button{border:1px solid #4e729b;border-radius:20px;padding:12px 18px;background:#192b43;color:#e7f1ff;font:600 14px system-ui;cursor:pointer}button:focus-visible{outline:2px solid #99d8ff;outline-offset:3px}#hold{touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}#hold[aria-pressed=true]{background:#356497}#sensorState{font-size:12px;margin:12px 0}details{font-size:12px;max-width:420px;margin:auto}summary{cursor:pointer}label{display:flex;align-items:center;gap:8px;justify-content:space-between;margin:8px}input{width:100px}#validation{font-size:11px}#simulate{margin:8px}@media(max-height:600px){#status{bottom:155px}button{padding:8px 14px}#sensorState{margin:6px}}
</style>
<div id="status" role="status">Listo para agitar</div>
<section id="controls" aria-label="Control de los dados">
 <div class="actions"><button id="enable">Activar movimiento</button><button id="hold">Mantener para agitar</button></div>
 <p id="sensorState" role="status">Sensor desactivado · también podés usar el botón</p>
 <details><summary>Ajustar detección</summary><label>Sensibilidad <input id="threshold" type="range" min="4" max="12" step=".5" value="7"><output id="thresholdValue">7</output></label><label>Pausa para frenar <input id="quiet" type="range" min="350" max="850" step="50" value="550"><output id="quietValue">550 ms</output></label><p id="validation">Preparando vista frontal…</p></details>
 <button id="simulate" hidden>Probar secuencia simulada</button>
</section>
<script>
const results={ua:navigator.userAgent,contexts:{},stages:[]};
function log(x){console.log('DICE_MOTION '+x);}
window.addEventListener('error',e=>log('ERROR '+e.message));
for(const type of ['webgl','webgl2']){const c=document.createElement('canvas'),g=c.getContext(type);results.contexts[type]=g?{version:g.getParameter(g.VERSION),renderer:g.getParameter(g.RENDERER)}:null;if(g)g.getExtension('WEBGL_lose_context')?.loseContext()}
log(JSON.stringify(results));
</script>
<script src="motion-engine.js"></script><script src="three.classic.js"></script><script>
try{
const THREE=window.THREE;
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x101526);
const viewHeight=12.45;
const camera=new THREE.OrthographicCamera(-viewHeight*innerWidth/innerHeight/2,viewHeight*innerWidth/innerHeight/2,viewHeight/2,-viewHeight/2,.1,100);camera.position.set(0,0,17);camera.lookAt(0,0,0);
function resizeViewport(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.left=-viewHeight*camera.aspect/2;camera.right=-camera.left;camera.top=viewHeight/2;const fittedHeight=Math.max(viewHeight,(w/h<.85?7.6:12.2)/(w/h));camera.top=fittedHeight/2;camera.bottom=-camera.top;camera.left=-fittedHeight*(w/h)/2;camera.right=-camera.left;camera.updateProjectionMatrix();camera.updateMatrixWorld();log('VIEWPORT '+JSON.stringify({width:w,height:h,canvasWidth:renderer.domElement.width,canvasHeight:renderer.domElement.height,cameraAspect:camera.aspect,pixelRatio:renderer.getPixelRatio(),projection:'orthographic'}));}
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>location.reload(),200)});resizeViewport();
scene.add(new THREE.HemisphereLight(0xffffff,0x334466,3));const light=new THREE.DirectionalLight(0xffffff,5);light.position.set(2,5,4);scene.add(light);
const objects=[];let complete=false,stage=-1,frames=0,start=performance.now(),last=start,stageStart=start,maxGap=0,read=false;
function setup(s){objects.forEach(o=>{scene.remove(o);o.traverse(n=>{n.geometry?.dispose();n.material?.dispose()})});objects.length=0;for(let i=0;i<(s===0?1:5);i++){const m=s===2?new THREE.MeshPhysicalMaterial({color:0x88ccff,roughness:.08,metalness:0,transmission:.9,thickness:.7,ior:1.5}):new THREE.MeshStandardMaterial({color:0x66aaff,roughness:.35});const o=new THREE.Group();o.add(new THREE.Mesh(new THREE.BoxGeometry(1.25,1.25,1.25),m));
const layouts={1:[[0,0]],2:[[-1,-1],[1,1]],3:[[-1,-1],[0,0],[1,1]],4:[[-1,-1],[-1,1],[1,-1],[1,1]],5:[[-1,-1],[-1,1],[0,0],[1,-1],[1,1]],6:[[-1,-1],[-1,0],[-1,1],[1,-1],[1,0],[1,1]]};
// +Z=1,-Z=6,+X=2,-X=5,+Y=3,-Y=4: opposite faces total seven.
for(const [value,axis,sign] of [[1,'z',1],[6,'z',-1],[2,'x',1],[5,'x',-1],[3,'y',1],[4,'y',-1]])for(const [u,v] of layouts[value]){const pip=new THREE.Mesh(new THREE.CircleGeometry(.085,12),new THREE.MeshBasicMaterial({color:0x102035,side:THREE.FrontSide}));if(axis==='z'){if(sign<0)pip.rotation.y=Math.PI;pip.position.set(u*.29,v*.29,sign*.628)}if(axis==='x'){pip.rotation.y=sign*Math.PI/2;pip.position.set(sign*.628,v*.29,u*.29)}if(axis==='y'){pip.rotation.x=-sign*Math.PI/2;pip.position.set(u*.29,sign*.628,v*.29)}o.add(pip)}o.rotation.set(i*.23,i*.4,i*.12);o.position.x=s===0?0:(i-2)*2.3;scene.add(o);objects.push(o)}log('START '+['one die','five dice','five glass dice'][s]);}
// Continuous positions and angular velocities; exact cube poses at rest.
const motionPeriod=16000, smoothIntegral=u=>u**6-3*u**5+2.5*u**4;
const faces=[[1,0,0,1],[6,0,0,-1],[2,1,0,0],[5,-1,0,0],[3,0,1,0],[4,0,-1,0]];
const validPoses=[];
for(let x=0;x<4;x++)for(let y=0;y<4;y++)for(let z=0;z<4;z++){
 const e=new THREE.Euler(x*Math.PI/2,y*Math.PI/2,z*Math.PI/2),q=new THREE.Quaternion().setFromEuler(e);
 if(validPoses.some(p=>Math.abs(p.q.dot(q))>.999999))continue;
 const top=faces.find(f=>new THREE.Vector3(...f.slice(1)).applyQuaternion(q).z>.999999)[0];
 validPoses.push({e:[e.x,e.y,e.z],q,top});
}
camera.updateMatrixWorld();
const smooth=u=>u*u*u*(10+u*(-15+6*u));
function projectedBox(p){const v=new THREE.Vector3(...p).applyMatrix4(camera.matrixWorldInverse),r=1.09;return {left:(v.x-r)/camera.right,right:(v.x+r)/camera.right,bottom:(v.y-r)/camera.top,top:(v.y+r)/camera.top};}
function anchor(i){return camera.aspect<.85?([[-2.3,1.4,0],[0,1.4,0],[2.3,1.4,0],[-1.15,-1.4,0],[1.15,-1.4,0]][i]):[(i-2)*2.3,0,0];}
function layoutSafe(from,to){const samples=from===to?0:20;for(let k=0;k<=samples;k++){const u=samples?k/samples:0,boxes=from.map((p,i)=>projectedBox(p.map((v,j)=>v+(to[i][j]-v)*u)));for(let i=0;i<5;i++){const b=boxes[i];if(b.left<-.94||b.right>.94||b.bottom<-.85||b.top>.85)return false;for(let j=0;j<i;j++){const a=boxes[j];if(!(b.left>a.right+.0015||a.left>b.right+.0015||b.bottom>a.top+.0015||a.bottom>b.top+.0015))return false;}}}return true;}
function randomLayout(from){for(let attempt=0;attempt<100;attempt++){const offset=(Math.random()-.5)*.1,to=Array.from({length:5},(_,i)=>{const p=anchor(i);return [p[0]+offset+(Math.random()-.5)*.04,p[1],0]});if(layoutSafe(from,to))return to;}return from.map(p=>p.slice());}
const {ShakeDetector,DiceMotion}=window.DiceMotionCore;
const detector=new ShakeDetector(),initialFaces=[1,2,3,4,6];
const choosePose=face=>{const poses=validPoses.filter(p=>p.top===face);return poses[Math.floor(Math.random()*poses.length)].e.slice();};
let held=false,enabled=false,sensorEvents=0,sensorData=0,enabledAt=0,lastData=0,permission='off',controlTestStart=null;
const sensorLabel=document.getElementById('sensorState'),enableButton=document.getElementById('enable'),holdButton=document.getElementById('hold'),status=document.getElementById('status');
const engine=new DiceMotion({initial:initialFaces.map(choosePose),frontFaces:initialFaces,choosePose,choosePositions:from=>randomLayout(from||initialFaces.map((_,i)=>anchor(i))),onTransition:s=>log('STATE '+JSON.stringify(s))});
setup(2);stage=2;
function sensorEvent(event){if(!enabled||document.hidden)return;sensorEvents++;if(detector.sample(event,performance.now())){sensorData++;lastData=performance.now();}}
function disableSensor(){enabled=false;detector.reset();window.removeEventListener('devicemotion',sensorEvent);enableButton.textContent='Activar movimiento';permission='off';sensorLabel.textContent='Sensor desactivado · también podés usar el botón';}
enableButton.addEventListener('click',async()=>{
 if(enabled){disableSensor();return;}
 if(!window.isSecureContext){sensorLabel.textContent='El sensor necesita HTTPS. Usá el botón mientras tanto.';return;}
 const API=window.DeviceMotionEvent;
 if(!API){sensorLabel.textContent='Este navegador no ofrece movimiento. Usá el botón.';return;}
 enableButton.disabled=true;
 try{
  const access=typeof API.requestPermission==='function'?await API.requestPermission():'granted';
  if(access!=='granted'){permission='denied';sensorLabel.textContent='Permiso denegado. Podés usar el botón o revisar los permisos del sitio.';return;}
  enabled=true;permission='granted';sensorEvents=0;sensorData=0;enabledAt=performance.now();lastData=0;detector.reset();window.addEventListener('devicemotion',sensorEvent);enableButton.textContent='Desactivar movimiento';sensorLabel.textContent='Permiso concedido · esperando datos del sensor…';
 }catch(error){permission='error';sensorLabel.textContent='No se pudo activar el sensor. Podés usar el botón o volver a intentarlo.';log('PERMISSION_ERROR '+error.name);}
 finally{enableButton.disabled=false;}
});
function release(){held=false;holdButton.setAttribute('aria-pressed','false');}
holdButton.addEventListener('pointerdown',event=>{if(event.button!==0)return;event.preventDefault();held=true;holdButton.setPointerCapture(event.pointerId);holdButton.setAttribute('aria-pressed','true');});
for(const name of ['pointerup','pointercancel','lostpointercapture'])holdButton.addEventListener(name,release);
holdButton.addEventListener('contextmenu',e=>e.preventDefault());
holdButton.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&!e.repeat){e.preventDefault();held=true;holdButton.setAttribute('aria-pressed','true');}});
holdButton.addEventListener('keyup',e=>{if(e.code==='Space'||e.code==='Enter'){e.preventDefault();release();}});
window.addEventListener('blur',release);document.addEventListener('visibilitychange',()=>{release();detector.reset();engine.setActive(false,performance.now());});
document.getElementById('threshold').addEventListener('input',e=>{detector.threshold=Number(e.target.value);document.getElementById('thresholdValue').textContent=e.target.value;detector.reset();});
document.getElementById('quiet').addEventListener('input',e=>{detector.quietMs=Number(e.target.value);document.getElementById('quietValue').textContent=e.target.value+' ms';});
const simulate=document.getElementById('simulate');simulate.hidden=!new URLSearchParams(location.search).has('test');simulate.addEventListener('click',()=>{controlTestStart=performance.now();simulate.disabled=true;});
let validatedSettle=-1;
function tick(now){
 let testHeld=false;if(controlTestStart!==null){const t=now-controlTestStart;testHeld=t<1000||(t>=1900&&t<2700);if(t>8200){controlTestStart=null;simulate.disabled=false;}}
 const sensorActive=enabled&&detector.active(now);engine.setActive(held||testHeld||sensorActive,now);const m=engine.advance(now);
 status.dataset.phase=m.phase;status.dataset.roll=String(m.roll);status.dataset.settled=String(m.settled);
 status.textContent=m.phase==='idle'?'Resultado: '+m.frontFaces.join(' · '):m.phase==='braking'?'Desacelerando…':controlTestStart!==null?'Agitando · prueba simulada':'Agitando…';
 if(enabled){const age=now-(lastData||enabledAt);sensorLabel.textContent=!sensorData?(now-enabledAt>4000?'Permiso concedido, pero no llegan datos. Probá el botón.':'Permiso concedido · esperando datos del sensor…'):age>3000?'Sensor sin datos recientes · podés usar el botón':sensorActive?'Sensor activo · sacudida detectada':'Sensor activo · sacudí el teléfono para agitar';}
 objects.forEach((o,i)=>{o.rotation.set(...m.rotations[i]);o.position.set(...m.positions[i]);});renderer.render(scene,camera);
 if(m.phase==='idle'&&validatedSettle!==m.settled){scene.updateMatrixWorld(true);const checks=objects.map((o,i)=>{const normals=faces.map(f=>({face:f[0],dot:new THREE.Vector3(...f.slice(1)).transformDirection(o.matrixWorld).z})),visible=normals.filter(f=>f.dot>1e-9),pips=o.children.slice(1).filter(p=>new THREE.Vector3(0,0,1).transformDirection(p.matrixWorld).z>1e-9).length;return {die:i,result:m.frontFaces[i],visibleFaces:visible.map(f=>f.face),visiblePips:pips,valid:visible.length===1&&visible[0].face===m.frontFaces[i]&&visible[0].dot>1-1e-10&&pips===m.frontFaces[i]};});const safe=layoutSafe(m.positions,m.positions),ok=safe&&checks.every(c=>c.valid);document.getElementById('validation').textContent=ok?'Una cara frontal por dado · sin superposición':'Revisar orientación';document.getElementById('validation').dataset.valid=String(ok);log('FRONT_VALIDATED '+JSON.stringify({roll:m.roll,settled:m.settled,layoutSafe:safe,allValid:ok,checks}));validatedSettle=m.settled;}
 requestAnimationFrame(tick);
}requestAnimationFrame(tick);
}catch(e){log('THREE_FAILED '+e.stack);document.getElementById('status').textContent='No se pudo iniciar 3D en este navegador.';}
</script>
