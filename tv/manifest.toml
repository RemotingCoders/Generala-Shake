schema-version = 1

[package]
title = "Generala"
version = "0.1.0"
id = "com.generalashake.tv"
icon = "@image/icon.png"

[os.version]
min = "1.2"
target = "1.2"

[needs]
[[needs.module]]
id = "/com.amazon.vega.os@IVega_1_2"

# WebView (3D dice, src/ui/Dice3D.js)
[[needs.module]]
id = "/com.amazon.kepler.keplerscript_4@IKeplerScript_0"

[[needs.module]]
id = "/com.amazon.kepler.webview_4@IWebview_4"

# Native media player (narrator voice)
[[needs.module]]
id = "/com.amazon.kepler.w3cmedia_2@IW3cmedia_3"

[components]
[[components.interactive]]
id = "com.generalashake.tv.main"
runtime-module = "/com.amazon.kepler.runtime.react_native_kepler_4@IReactNativeKepler_0"
launch-type = "singleton"
categories = ["com.amazon.category.main"]

[wants]
# Web renderer service for the WebView (3D dice)
[[wants.service]]
id = "com.amazon.webview.renderer_service"

# Narrator voice: native media player (src/ui/Voice.js, @amazon-devices/react-native-w3cmedia)
[[wants.service]]
id = "com.amazon.media.server"

[[wants.service]]
id = "com.amazon.media.playersession.service"

[[wants.service]]
id = "com.amazon.audio.stream"

[[wants.service]]
id = "com.amazon.audio.control"

# Accessibility (VoiceView) support, recommended by the Vega WebView guide
[[wants.service]]
id = "com.amazon.kepler.ucc.publisher"
